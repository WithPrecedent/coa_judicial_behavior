# Project packaging rules and instructions

[project]
name = "coa-judicial-behavior"
description = "Ideology, activism, partisanship, and independence scores of federal appellate judges from CourtListener opinions"
authors = [{name = "Corey Rayburn Yung", email = "coreyrayburnyung@gmail.com"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
# The version is set by `__version__` in "src/coa_judicial_behavior/__init__.py".
dynamic = ["version"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis"]
keywords = [
    "courtlistener",
    "courts of appeals",
    "empirical legal studies",
    "judicial activism",
    "judicial behavior",
    "judicial ideology",
    "judicial independence",
    "partisanship"]
dependencies = [
    # "statistics" adds statsmodels (the probit tests of the scores) and
    # pyfixest, "plots" the figures, and "encoders" the one-hot encoding of
    # the predictions.
    "amos[encoders,plots,statistics]>=0.4.0",
    "courtpy>=0.3.0",
    "numpy>=1.26",
    "pandas>=3.0",
    # Saves tables of cases as parquet files, which keep lists and types.
    "pyarrow>=15",
    # Ward's clustering of the judging styles.
    "scipy>=1.11"]

[project.optional-dependencies]

[project.scripts]
coa-judicial-behavior = "coa_judicial_behavior.__main__:main"

[project.urls]
Documentation = "https://WithPrecedent.github.io/coa_judicial_behavior"
Repository = "https://github.com/WithPrecedent/coa_judicial_behavior"
Homepage = "https://github.com/WithPrecedent/coa_judicial_behavior"
Issues = "https://github.com/WithPrecedent/coa_judicial_behavior/issues"
Changelog = "https://WithPrecedent.github.io/coa_judicial_behavior/changelog"

[dependency-groups]
dev = [
    "uv",
    "markdown-callouts",
    "markdown-exec",
    "mkdocs",
    "mkdocs-coverage",
    "mkdocs-gen-files",
    "mkdocs-git-committers-plugin-2",
    "mkdocs-literate-nav",
    "mkdocs-material",
    "mkdocs-minify-plugin",
    "mkdocstrings[python]",
    "toml",
    "mypy",
    "pandas-stubs",
    "pre-commit",
    "ruff",
    {include-group = "tests"}]
tests = [
    "coverage",
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "pytest-xdist"]

[build-system]
# Version 1.27 is the first to support SPDX license expressions (PEP 639).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/coa_judicial_behavior/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/coa_judicial_behavior"]


[tool.coverage.report]
skip_empty = true
show_missing = true
# Adds to (instead of replacing) the default exclusions, such as
# "pragma: no cover".
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:"]

[tool.coverage.paths]
source = ["src", "*/site-packages"]
tests = ["tests", "*/tests"]

[tool.coverage.run]
branch = true
source = ["coa_judicial_behavior", "tests"]



[tool.mypy]
files = ['src']
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
# These packages are annotated but do not ship a py.typed marker.
module = [
    "amos.*",
    "chrisjen.*",
    "courtpy.*",
    "fjc_biographies.*",
    "scipy.*",
    "statsmodels.*"]
follow_untyped_imports = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--showlocals"
filterwarnings = ["ignore::DeprecationWarning"]
pythonpath = ["src"]

[tool.ruff]
extend-exclude = ["docs", "scripts", "site", "studies", "tests", ".*.*"]
fix = true
line-length = 80
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
lint.fixable = ["ALL"]
lint.ignore = [
    "A001",  # Variable is shadowing a Python builtin
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "ARG003",  # Unused class method argument: `parameters`
    "ARG005",  # Unused lambda argument
    "COM812",  # Recommended disable by Ruff
    "C901",  # Too complex
    "D105",  # Missing docstring in magic method
    "D400",  # First line must end in a period
    "D401",  # First line of docstring should be in imperative mood
    "D406",  # Section name should end with a newline - bugged for 'Attributes:'
    "D407",  # Missing dashed underline after section ("Args")
    "D415",  # First line must end in a period, question mark, or exclamation point
    "E501",  # Line too long
    "E731",  # Do not assign a `lambda` expression, use a `def`
    "ERA001",  # Commented out code
    "EXE002",  # No shebang is present in an executable file
    "FBT001",  # Boolean positional arg in function definition
    "FBT002",  # Boolean default positional arg in function definition
    "FBT003",  # Boolean positional value in function call (pd.Series(False))
    "G004",  # Logging statement uses f-string
    "PTH123",  # `open()` should be replaced by `Path.open()`
    "PLR0911",  # Too many return statements
    "PLR0912",  # Too many branches
    "PLR0913",  # Too many arguments to function call
    "PLR0915",  # Too many statements
    "PLR1711", # Useless 'return' at the end of function
    "PLR2004",  # Magic value used in comparison
    "Q000",  # Single quotes found but double quotes preferred
    "RET505",  # Unnecessary `else` after `return` statement
    # "S0001",  # Use of assert detected
    "SLF001", # Private member accessed
    "TID252",  # Relative imports are banned
    "TRY003",]  # Avoid specifying long messages outside the exception class
lint.select = [
    "A",  # flake8-buttons
    "ANN",  # flake8-annotations
    "ARG",  # flake8-unused-arguments
    "B",  # flake8-bugbear
    "BLE",  # flake8-blind-except
    "C",  #
    "C4",  # flake8-comprehensions
    "COM",  # flake8-commas
    "D",  # pydocstyle
    "DTZ",  # flake8-datetimez
    "E",  # pydocstyle errors
    "ERA",  # eradicate
    "EXE",  # flake8-executable
    "F",  # Pyflakes
    "FBT",  # flake8-boolean-trap
    "G",  # flake8-logging-format
    "I",  # isort
    "ICN",  # flake8-import-conventions
    "INP",  # flake8-no-pep420
    "ISC",  # flake8-implicit-str-concat
    "N",  # pep8-naming
    "NPY",  # NumPy-specific rules
    "PD",  # pandas-vet
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PL",  # Pylint
    "PLC",  # Pylint
    "PLE",  # Pylint
    "PLR",  # Pylint
    "PLW",  # Pylint
    "PT",  # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "PYI",  # flake8-pyi
    "Q",  # flake8-quotes
    "RUF",  # Ruff-specific rules
    "RSE",  # flake8-raise
    "RET",  # flake8-return
    "S",  # bandit
    "SIM",  # flake8-slots
    "SLF",  # flake8-self
    "T",  #
    "T10",  # flake8-debugger
    "T20",  # flake8-print
    "TID",  # flake8-tidy-imports
    "TRY",  # tryceratops
    "UP",  # pyupgrade
    "W",  # pydocstyle warnings
    "YTT",]  # flake8-2020
lint.task-tags = ["To Do:"]

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"
multiline-quotes = "double"

[tool.ruff.lint.flake8-type-checking]
exempt-modules = ["typing", "typing_extensions"]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.isort]
case-sensitive = true
required-imports = ["from __future__ import annotations"]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
# The commands print their results.
"src/coa_judicial_behavior/__main__.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-decorators = ["typing.overload"]

[tool.uv]
package = true

[tool.cruft]
# Paths that `cruft update` leaves alone because they belong to this project
# instead of the `snickerdoodle` template.
skip = ["CHANGELOG.md", "README.md", "src", "studies", "tests", "uv.lock"]
